name: Record Gameplay Scenarios

# Bu workflow ProjectKIR'ı iOS Simulator'da açar, 5 farklı oynanış senaryosunu
# keyboard/touch event'leri ile oynatır ve her birini ayrı video olarak kaydeder.
#
# Araçlar:
#   - xcrun simctl      : simulator boot/install/launch/recordVideo
#   - cliclick (brew)   : keyboard key down/up events (gameplay control)
#   - idb (facebook/fb) : simulator touch events (menu button taps)
#   - AppleScript       : Simulator.app activate + fallback keystroke
#
# Senaryolar:
#   1. Ana Menü + Bölüm Seçimi (menu → tap "Yeni Oyun" → chapter card)
#   2. İlk Adımlar — L01 Arrival (walk right, jump, crouch)
#   3. Rezonans Pulsu — Kapı Açma (charge J, release, door opens)
#   4. Vana Bulmacası — Su Yükselmesi (switch to BODY freq, fire pulse at valve)
#   5. Dron'dan Kaçış (walk + crouch to avoid drone sight cone)

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenario numbers (e.g. "1,2,3,4,5" or "all")'
        default: 'all'
      device:
        description: 'Simulator device'
        type: choice
        options:
          - iPhone 15 Pro
          - iPhone 15
          - iPad (10th generation)
        default: iPhone 15 Pro

jobs:
  record:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (cliclick for keyboard + mouse)
        run: |
          echo "=== Install cliclick (keyboard + mouse event tool) ==="
          brew install cliclick
          which cliclick && cliclick -V

      - name: Find device UDID
        id: sim
        run: |
          DEVICE="${{ github.event.inputs.device || 'iPhone 15 Pro' }}"
          echo "Device: $DEVICE"
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          target = '$DEVICE'
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['name'] == target and d.get('isAvailable', False):
                      print(d['udid'])
                      sys.exit(0)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if 'iPhone' in d['name'] and d.get('isAvailable', False):
                      print(d['udid']); sys.exit(0)
          ")
          [ -z "$UDID" ] && { echo "ERROR: No simulator found"; exit 1; }
          echo "UDID=$UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          echo "device=$DEVICE" >> $GITHUB_OUTPUT

      - name: Boot simulator
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "Booting $UDID..."
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "Simulator booted."
          # Open Simulator.app for AppleScript / cliclick (needs GUI frontmost)
          open -a Simulator
          sleep 5

      - name: Build app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "=== BUILD START ==="
          xcodebuild \
            -project ProjectKIR.xcodeproj \
            -scheme ProjectKIR \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== BUILD EXIT: $BUILD_EXIT ==="
          exit $BUILD_EXIT

      - name: Install + get bundle ID
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/DerivedData -name "*.app" -path "*Debug*" -type d | head -1)
          [ -z "$APP" ] && { echo "ERROR: .app not found"; exit 1; }
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          echo "bundle_id=$BUNDLE_ID" >> $GITHUB_ENV

      - name: Helper — launch app + start recording + tap helper
        id: helpers
        run: |
          # Helper functions for scenario scripts
          cat > /tmp/scenario_helpers.sh << 'HELPER_EOF'
          #!/bin/bash

          # Fonksiyon: launch_and_record <UDID> <BUNDLE_ID> <SCENARIO_NUM>
          launch_and_record() {
            local UDID="$1"
            local BUNDLE_ID="$2"
            local SCENARIO="$3"
            local VIDEO_FILE="artifacts/scenario-${SCENARIO}.mp4"

            mkdir -p artifacts

            echo "--- Scenario $SCENARIO: terminate old app ---"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            sleep 1

            echo "--- Scenario $SCENARIO: launch app ---"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 5  # wait for menu to render (parallax + amber light pulse)

            echo "--- Scenario $SCENARIO: start recording ---"
            # --duration=20: otomatik 20 saniye sonra durur (kill gerekmez)
            xcrun simctl io "$UDID" recordVideo --codec=h264 --duration=20 --force "$VIDEO_FILE" &
            local REC_PID=$!
            echo "$REC_PID" > /tmp/rec_pid
            sleep 2  # recordVideo'nun başlamasını bekle

            # recordVideo gerçekten çalışıyor mu?
            if kill -0 "$REC_PID" 2>/dev/null; then
              echo "--- Scenario $SCENARIO: recording started (PID=$REC_PID) → $VIDEO_FILE ---"
            else
              echo "--- Scenario $SCENARIO: WARN: recordVideo may have failed — trying foreground ---"
              # Hata mesajını görmek için foreground'da kısa süre dene
              xcrun simctl io "$UDID" recordVideo --codec=h264 --duration=15 --force "$VIDEO_FILE" 2>&1 | head -5 &
              REC_PID=$!
              echo "$REC_PID" > /tmp/rec_pid
              sleep 2
            fi
          }
          HELPER_EOF
          chmod +x /tmp/scenario_helpers.sh

          # Tap helper — finds Simulator window and clicks at relative position
          cat > /tmp/tap_simulator.sh << 'TAP_EOF'
          #!/bin/bash
          set +e  # hataları durdurma — dayanıklı ol
          # Usage: tap_simulator.sh <relative_x> <relative_y>
          # relative_x/y: 0.0-1.0 (fraction of window width/height)
          # e.g. tap_simulator.sh 0.5 0.4 = center, slightly above middle

          REL_X="${1:-0.5}"
          REL_Y="${2:-0.5}"

          # Get Simulator window position and size
          POS=$(osascript -e 'tell application "System Events" to tell process "Simulator" to get position of window 1' 2>/dev/null)
          SIZE=$(osascript -e 'tell application "System Events" to tell process "Simulator" to get size of window 1' 2>/dev/null)

          if [ -z "$POS" ] || [ -z "$SIZE" ]; then
            echo "WARN: Could not get Simulator window position/size (System Events permission?)"
            echo "Trying to activate Simulator..."
            osascript -e 'tell application "Simulator" to activate' 2>/dev/null
            sleep 2
            POS=$(osascript -e 'tell application "System Events" to tell process "Simulator" to get position of window 1' 2>/dev/null)
            SIZE=$(osascript -e 'tell application "System Events" to tell process "Simulator" to get size of window 1' 2>/dev/null)
          fi

          if [ -z "$POS" ] || [ -z "$SIZE" ]; then
            echo "WARN: Simulator window not found — tap skipped (video will still record static state)"
            exit 0
          fi

          # Parse AppleScript output: "x, y" and "w, h"
          X=$(echo "$POS" | sed 's/,.*//' | tr -d ' ')
          Y=$(echo "$POS" | sed 's/.*,//' | tr -d ' ')
          W=$(echo "$SIZE" | sed 's/,.*//' | tr -d ' ')
          H=$(echo "$SIZE" | sed 's/.*,//' | tr -d ' ')

          # Calculate tap position
          TAP_X=$(python3 -c "print(int($X + $W * $REL_X))" 2>/dev/null)
          TAP_Y=$(python3 -c "print(int($Y + $H * $REL_Y))" 2>/dev/null)

          if [ -z "$TAP_X" ] || [ -z "$TAP_Y" ]; then
            echo "WARN: Could not calculate tap position"
            exit 0
          fi

          echo "Simulator window: pos=($X,$Y) size=($W,$H)"
          echo "Tapping at: ($TAP_X, $TAP_Y) [relative ($REL_X, $REL_Y)]"

          # Click via cliclick (may fail if no GUI session)
          cliclick c:$TAP_X,$TAP_Y 2>/dev/null
          if [ $? -ne 0 ]; then
            echo "WARN: cliclick failed — trying osascript click"
            osascript -e "tell application \"System Events\" to click at {$TAP_X, $TAP_Y}" 2>/dev/null
          fi
          echo "Tap attempt completed."
          exit 0
          TAP_EOF
          chmod +x /tmp/tap_simulator.sh

          echo "Helpers written."

      - name: Record Scenario 1 — Ana Menü + Bölüm Seçimi
        if: always() && (contains(github.event.inputs.scenarios, '1') || github.event.inputs.scenarios == 'all')
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ env.bundle_id }}"
          set +e  # dayanıklı mod — hata olsa bile step devam etsin
          source /tmp/scenario_helpers.sh
          launch_and_record "$UDID" "$BUNDLE_ID" "1"

          # SCENARIO 1: Show menu animation, then tap "Yeni Oyun"
          #
          # MainMenuScene buttons (landscape, center + vertical offsets):
          #   newGame: cy - 20 (slightly above center → relative Y ≈ 0.45)
          #   cont:    cy - 76
          #   settings: cy - 132
          #   credits: cy - 188
          #
          # Show menu for 3s (parallax + amber signal light pulse)
          sleep 3

          # Tap "Yeni Oyun" — center horizontally, slightly above center vertically
          echo "Tapping 'Yeni Oyun' (relative 0.5, 0.45)..."
          /tmp/tap_simulator.sh 0.5 0.45 || echo "tap failed"

          # Wait for chapter card + transition (chapter card auto-advances after 3s)
          sleep 7

          # Stop recording
          kill -INT $(cat /tmp/rec_pid) 2>/dev/null || true
          wait $(cat /tmp/rec_pid) 2>/dev/null || true
          sleep 1

          echo "=== Scenario 1 video ==="
          ls -la artifacts/scenario-1.mp4 2>/dev/null || echo "WARNING: video not created"

      - name: Record Scenario 2 — İlk Adımlar (L01 Arrival)
        if: always() && (contains(github.event.inputs.scenarios, '2') || github.event.inputs.scenarios == 'all')
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ env.bundle_id }}"
          set +e  # dayanıklı mod — hata olsa bile step devam etsin
          source /tmp/scenario_helpers.sh
          launch_and_record "$UDID" "$BUNDLE_ID" "2"

          # SCENARIO 2: Start game, walk right, jump, crouch
          # Tap "Yeni Oyun" to start
          /tmp/tap_simulator.sh 0.5 0.45 || true

          # Wait for chapter card (3s) + gameplay start
          sleep 6

          # Walk right for 2 seconds (hold D key via cliclick)
          echo "Walking right (hold D for 2s)..."
          cliclick kd:d
          sleep 2
          cliclick ku:d

          # Jump (press W)
          echo "Jumping (press W)..."
          osascript -e 'tell application "System Events" to keystroke "w"' 2>/dev/null || true
          sleep 1

          # Crouch (press S)
          echo "Crouching (press S)..."
          osascript -e 'tell application "System Events" to keystroke "s"' 2>/dev/null || true
          sleep 1

          # Show parallax + environment
          sleep 3

          # Stop recording
          kill -INT $(cat /tmp/rec_pid) 2>/dev/null || true
          wait $(cat /tmp/rec_pid) 2>/dev/null || true
          sleep 1

          echo "=== Scenario 2 video ==="
          ls -la artifacts/scenario-2.mp4 2>/dev/null || echo "WARNING: video not created"

      - name: Record Scenario 3 — Rezonans Pulsu (Kapı Açma)
        if: always() && (contains(github.event.inputs.scenarios, '3') || github.event.inputs.scenarios == 'all')
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ env.bundle_id }}"
          set +e  # dayanıklı mod — hata olsa bile step devam etsin
          source /tmp/scenario_helpers.sh
          launch_and_record "$UDID" "$BUNDLE_ID" "3"

          # SCENARIO 3: Walk to door, charge pulse (J), release → door opens
          # Start game
          /tmp/tap_simulator.sh 0.5 0.45 || true
          sleep 6  # chapter card + gameplay start

          # Walk right to approach door (door at x=950, player starts at x=140)
          echo "Walking to door (hold D for 4s)..."
          cliclick kd:d
          sleep 4
          cliclick ku:d
          sleep 1

          # Charge resonance pulse (hold J for ~1s)
          echo "Charging pulse (hold J)..."
          cliclick kd:j
          sleep 1.5
          # Release → fire pulse
          echo "Releasing pulse (release J)..."
          cliclick ku:j

          # Watch door open + amber signal light
          sleep 6

          # Stop recording
          kill -INT $(cat /tmp/rec_pid) 2>/dev/null || true
          wait $(cat /tmp/rec_pid) 2>/dev/null || true
          sleep 1

          echo "=== Scenario 3 video ==="
          ls -la artifacts/scenario-3.mp4 2>/dev/null || echo "WARNING: video not created"

      - name: Record Scenario 4 — Vana Bulmacası (Su Yükselmesi)
        if: always() && (contains(github.event.inputs.scenarios, '4') || github.event.inputs.scenarios == 'all')
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ env.bundle_id }}"
          set +e  # dayanıklı mod — hata olsa bile step devam etsin
          source /tmp/scenario_helpers.sh
          launch_and_record "$UDID" "$BUNDLE_ID" "4"

          # SCENARIO 4: Walk to valve, switch to BODY frequency, fire pulse
          # Start game
          /tmp/tap_simulator.sh 0.5 0.45 || true
          sleep 6

          # Walk right to find valve
          echo "Walking to valve (hold D for 5s)..."
          cliclick kd:d
          sleep 5
          cliclick ku:d
          sleep 1

          # Switch to BODY frequency (press E to cycle DEEP → BODY)
          echo "Switching to BODY frequency (press E)..."
          osascript -e 'tell application "System Events" to keystroke "e"' 2>/dev/null || true
          sleep 1

          # Charge + fire pulse at valve
          echo "Charging pulse at valve (hold J)..."
          cliclick kd:j
          sleep 1.5
          cliclick ku:j

          # Watch water rise
          sleep 7

          # Stop recording
          kill -INT $(cat /tmp/rec_pid) 2>/dev/null || true
          wait $(cat /tmp/rec_pid) 2>/dev/null || true
          sleep 1

          echo "=== Scenario 4 video ==="
          ls -la artifacts/scenario-4.mp4 2>/dev/null || echo "WARNING: video not created"

      - name: Record Scenario 5 — Dron'dan Kaçış
        if: always() && (contains(github.event.inputs.scenarios, '5') || github.event.inputs.scenarios == 'all')
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ env.bundle_id }}"
          set +e  # dayanıklı mod — hata olsa bile step devam etsin
          source /tmp/scenario_helpers.sh
          launch_and_record "$UDID" "$BUNDLE_ID" "5"

          # SCENARIO 5: Walk into drone patrol area, crouch to hide, evade
          # Start game
          /tmp/tap_simulator.sh 0.5 0.45 || true
          sleep 6

          # Walk right into drone area
          echo "Walking into drone patrol area (hold D for 4s)..."
          cliclick kd:d
          sleep 4
          cliclick ku:d
          sleep 1

          # Crouch to reduce drone sight range (spec 56: crouchSightFactor = 0.6)
          echo "Crouching to hide from drone (press S)..."
          osascript -e 'tell application "System Events" to keystroke "s"' 2>/dev/null || true
          sleep 2

          # Continue moving while crouched
          echo "Moving while crouched (hold D + S)..."
          cliclick kd:d
          sleep 3
          cliclick ku:d

          # Show drone patrol + alert state
          sleep 4

          # Stop recording
          kill -INT $(cat /tmp/rec_pid) 2>/dev/null || true
          wait $(cat /tmp/rec_pid) 2>/dev/null || true
          sleep 1

          echo "=== Scenario 5 video ==="
          ls -la artifacts/scenario-5.mp4 2>/dev/null || echo "WARNING: video not created"

      - name: Summary — list all videos
        if: always()
        run: |
          echo "=== All scenario videos ==="
          ls -la artifacts/scenario-*.mp4 2>/dev/null || echo "No videos found"
          echo ""
          echo "=== Video file sizes ==="
          for f in artifacts/scenario-*.mp4; do
            if [ -f "$f" ]; then
              SIZE=$(stat -f%z "$f" 2>/dev/null || stat -c%s "$f" 2>/dev/null)
              echo "  $f: $SIZE bytes"
            fi
          done

      - name: Upload all scenario videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-scenarios
          path: |
            artifacts/scenario-*.mp4
            build.log
          if-no-files-found: warn
          retention-days: 30
