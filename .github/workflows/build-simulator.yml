name: Build & Run iOS Simulator

# Bu workflow, GitHub'ın ücretsiz macOS runner'larını kullanarak
# ProjectKIR.xcodeproj dosyasını derler, iOS Simulator'da açar,
# ekran görüntüsü ve ~10 saniyelik video kaydı alır, artifact olarak yükler.
#
# Önemli: Bundle ID hard-coded DEĞİL — build sonrası .app/Info.plist'ten
# plutil ile gerçek değer çıkarılır. Stub JSON üretimi YOK — gerçek
# level dosyaları repoda mevcut, sadece Python validator ile doğrulanır.
#
# Tetikleyiciler:
#   - workflow_dispatch : GitHub Actions sekmesinden manuel "Run workflow"
#   - push (main)       : main dalına push yapınca otomatik çalışır
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator cihazı'
        type: choice
        options:
          - iPhone 15 Pro
          - iPhone 15
          - iPhone 14 Pro
          - iPhone SE (3rd generation)
          - iPad (10th generation)
        default: iPhone 15 Pro
      delay:
        description: 'Uygulama render beklemesi (sn)'
        default: '8'
  push:
    branches: [main]

jobs:
  build-and-screenshot:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcode versions available on runner
        run: |
          ls /Applications | grep -i xcode || true
          echo "---"
          xcodebuild -version

      - name: Select Xcode 16.2 (newer pbxproj compatibility)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          echo "Active Xcode:"
          xcodebuild -version

      - name: Diagnostic — inspect pbxproj after checkout
        run: |
          echo "=== pbxproj ilk 10 satır ==="
          head -10 ProjectKIR.xcodeproj/project.pbxproj
          echo ""
          echo "=== pbxproj file tipi ==="
          file ProjectKIR.xcodeproj/project.pbxproj
          echo ""
          echo "=== pbxproj byte uzunluğu ==="
          wc -c ProjectKIR.xcodeproj/project.pbxproj
          echo ""
          echo "=== pbxproj md5 ==="
          md5 -q ProjectKIR.xcodeproj/project.pbxproj 2>/dev/null || md5sum ProjectKIR.xcodeproj/project.pbxproj
          echo ""
          echo "=== CRLF var mı? ==="
          grep -c $'\r' ProjectKIR.xcodeproj/project.pbxproj || echo "0 (no CR)"
          echo ""
          echo "=== plutil -lint pbxproj ==="
          plutil -lint ProjectKIR.xcodeproj/project.pbxproj
          echo ""
          echo "=== plutil -lint contents.xcworkspacedata ==="
          plutil -lint ProjectKIR.xcodeproj/project.xcworkspace/contents.xcworkspacedata 2>&1 || echo "(lint başarısız)"
          echo ""
          echo "=== plutil -lint WorkspaceSettings.xcsettings ==="
          plutil -lint ProjectKIR.xcodeproj/project.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings 2>&1 || echo "(lint başarısız)"
          echo ""
          echo "=== plutil -lint ProjectKIR.xcscheme ==="
          plutil -lint ProjectKIR.xcodeproj/xcshareddata/xcschemes/ProjectKIR.xcscheme 2>&1 || echo "(lint başarısız)"
          echo ""
          echo "=== .xcodeproj dizin içeriği ==="
          find ProjectKIR.xcodeproj -type f

      - name: List schemes in project (verify shared scheme exists)
        run: |
          echo "=== xcodebuild -list ==="
          xcodebuild -project ProjectKIR.xcodeproj -list

      - name: Show resolved build settings (DEBUG, simulator)
        run: |
          echo "=== xcodebuild -showBuildSettings ==="
          xcodebuild \
            -project ProjectKIR.xcodeproj \
            -scheme ProjectKIR \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildSettings 2>&1 | tee build-settings.log | \
          grep -E "PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|TARGET_NAME|INFOPLIST_FILE|IPHONEOS_DEPLOYMENT_TARGET|SWIFT_VERSION|SDKROOT|CONFIGURATION_BUILD_DIR|BUILT_PRODUCTS_DIR|FULL_PRODUCT_NAME" | head -20

      - name: Verify all referenced resource files exist (no stubs)
        run: |
          set -e
          PBXPROJ="ProjectKIR.xcodeproj/project.pbxproj"
          echo "=== pbxproj'da referans verilen tüm Resources dosyaları ==="
          grep -oE '[A-Za-z0-9_./]+\.json in Resources' "$PBXPROJ" | awk '{print $1}' | sort -u
          echo ""
          echo "=== Her dosya için varlık kontrolü ==="
          MISSING=0
          while IFS= read -r fname; do
            [ -z "$fname" ] && continue
            FOUND=""
            for dir in ProjectKIR/Resources ProjectKIR/Resources/Levels ProjectKIR/Resources/Config ProjectKIR/Resources/Assets.xcassets; do
              path="$dir/$fname"
              if [ -f "$path" ]; then
                FOUND="$path"
                break
              fi
            done
            if [ -n "$FOUND" ]; then
              echo "OK: $FOUND"
            else
              echo "MISSING: $fname"
              MISSING=$((MISSING+1))
            fi
          done < <(grep -oE '[A-Za-z0-9_./]+\.json in Resources' "$PBXPROJ" | awk '{print $1}' | sort -u)
          echo ""
          echo "Eksik dosya sayısı: $MISSING"
          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: pbxproj referans verilen bazı dosyalar repoda yok. Stub üretmek yerine gerçek dosyaları sağlayın."
            exit 1
          fi

      - name: Run native level validator (Python, spec 158)
        run: |
          echo "=== validate_levels.py ==="
          python3 Tools/LevelValidator/validate_levels.py | tee validator.log
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -ne 0 ]; then
            echo "ERROR: Level validator hatası — lütfen JSON dosyalarını düzeltin."
            exit 1
          fi
          echo "Tüm level'lar şemaya uygun."

      - name: List available iOS Simulators
        run: |
          echo "=== AVAILABLE SIMULATORS ==="
          xcrun simctl list devices available | head -60

      - name: Resolve selected device UDID
        id: sim
        run: |
          DEVICE="${{ github.event.inputs.device || 'iPhone 15 Pro' }}"
          echo "Selected device: $DEVICE"
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          target = '$DEVICE'
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['name'] == target and d.get('isAvailable', False):
                      print(d['udid'])
                      sys.exit(0)
          ")
          if [ -z "$UDID" ]; then
            echo 'WARN: Selected device not found, falling back to first available iPhone'
            UDID=$(xcrun simctl list devices available -j | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            for runtime, devices in data['devices'].items():
                for d in devices:
                    if 'iPhone' in d['name'] and d.get('isAvailable', False):
                        print(d['udid']); sys.exit(0)
            ")
          fi
          [ -z "$UDID" ] && { echo 'ERROR: No iPhone simulator found'; exit 1; }
          echo "UDID=$UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          echo "device=$DEVICE" >> $GITHUB_OUTPUT

      - name: Build for iOS Simulator
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "=== BUILD START ==="
          set +e
          xcodebuild \
            -project ProjectKIR.xcodeproj \
            -scheme ProjectKIR \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== BUILD END (exit code: $BUILD_EXIT) ==="
          exit $BUILD_EXIT

      - name: Locate .app bundle
        id: find_app
        run: |
          APP=$(find build/DerivedData -name "*.app" -path "*Debug*" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: .app bundle bulunamadı. Build log son 80 satır:"
            tail -80 build.log
            exit 1
          fi
          echo "Found app: $APP"
          echo "app_path=$APP" >> $GITHUB_OUTPUT
          APP_NAME=$(basename "$APP")
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Inspect built .app — real bundle ID + executable
        id: app_info
        run: |
          APP="${{ steps.find_app.outputs.app_path }}"
          echo "=== .app içeriği ==="
          ls -la "$APP"
          echo ""
          echo "=== Info.plist önemli key'ler ==="
          REAL_BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist" 2>/dev/null || echo "")
          REAL_DISPLAY_NAME=$(plutil -extract CFBundleDisplayName raw "$APP/Info.plist" 2>/dev/null || echo "")
          REAL_EXEC=$(plutil -extract CFBundleExecutable raw "$APP/Info.plist" 2>/dev/null || echo "")
          REAL_VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist" 2>/dev/null || echo "")
          REAL_BUILD=$(plutil -extract CFBundleVersion raw "$APP/Info.plist" 2>/dev/null || echo "")
          REAL_MIN_OS=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist" 2>/dev/null || echo "")
          echo "CFBundleIdentifier     = $REAL_BUNDLE_ID"
          echo "CFBundleDisplayName    = $REAL_DISPLAY_NAME"
          echo "CFBundleExecutable      = $REAL_EXEC"
          echo "CFBundleShortVersion   = $REAL_VERSION"
          echo "CFBundleVersion        = $REAL_BUILD"
          echo "MinimumOSVersion       = $REAL_MIN_OS"
          [ -z "$REAL_BUNDLE_ID" ] && { echo "ERROR: Bundle ID read edilemedi"; exit 1; }
          echo "bundle_id=$REAL_BUNDLE_ID" >> $GITHUB_OUTPUT

      - name: Boot iOS Simulator
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "Booting simulator $UDID..."
          xcrun simctl bootstatus "$UDID" -b || xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "Simulator booted."

      - name: Install app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl install "$UDID" "${{ steps.find_app.outputs.app_path }}"

      - name: Verify installation (listapps)
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          EXPECTED_BUNDLE="${{ steps.app_info.outputs.bundle_id }}"
          echo "=== xcrun simctl listapps ==="
          xcrun simctl listapps "$UDID" > listapps.log
          cat listapps.log
          echo ""
          echo "=== Beklenen bundle: $EXPECTED_BUNDLE ==="
          if grep -q "$EXPECTED_BUNDLE" listapps.log; then
            echo "OK: App simulatorde bulundu"
          else
            echo "ERROR: App simulatorde bulunamadı!"
            exit 1
          fi

      - name: Launch app (real bundle ID)
        id: launch
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          BUNDLE_ID="${{ steps.app_info.outputs.bundle_id }}"
          echo "Launching bundle: $BUNDLE_ID"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" 2>&1 | tee launch.log
          sleep 2
          cat launch.log

      - name: Wait for app to render
        run: |
          DELAY="${{ github.event.inputs.delay || '8' }}"
          echo "Waiting $DELAY seconds for the app to render..."
          sleep "$DELAY"

      - name: Take first screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/01-initial.png

      - name: Record ~10 second video
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" recordVideo --codec=h264 artifacts/recording.mp4 &
          REC_PID=$!
          sleep 10
          kill -INT $REC_PID 2>/dev/null || true
          wait $REC_PID 2>/dev/null || true
          echo "Video saved."

      - name: Take second screenshot after video
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" screenshot artifacts/02-after-10s.png

      - name: Get app console log
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP_EXEC="${{ steps.find_app.outputs.app_name }}"
          EXEC_NAME="${APP_EXEC%.app}"
          xcrun simctl spawn "$UDID" log show --last 30s --predicate "process == \"$EXEC_NAME\"" 2>&1 | head -200 > artifacts/app-console.log || true
          echo "App console log saved."

      - name: Capture simulator diagnostics
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p artifacts
          xcrun simctl list devices | grep -E "Booted|$UDID" > artifacts/sim-status.log 2>&1 || true
          cp build.log artifacts/ 2>/dev/null || true
          cp build-settings.log artifacts/ 2>/dev/null || true
          cp listapps.log artifacts/ 2>/dev/null || true
          cp launch.log artifacts/ 2>/dev/null || true
          cp validator.log artifacts/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-capture
          path: |
            artifacts/
          if-no-files-found: warn
          retention-days: 30
