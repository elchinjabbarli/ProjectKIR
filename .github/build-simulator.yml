name: Build & Run iOS Simulator

# Bu workflow, GitHub'ın ücretsiz macOS runner'larını kullanarak
# ProjectKIR.xcodeproj dosyasını derler, iOS Simulator'da açar,
# ekran görüntüsü ve 5 saniyelik video kaydı alır, artifact olarak yükler.
#
# Tetikleyiciler:
#   - workflow_dispatch : GitHub Actions sekmesinden manuel "Run workflow" butonu
#   - push (main/master) : bu dallara push yapınca otomatik çalışır
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Simulator cihazı'
        type: choice
        options:
          - iPhone 15 Pro
          - iPhone 15
          - iPhone 14 Pro
          - iPhone SE (3rd generation)
          - iPad (10th generation)
        default: iPhone 15 Pro
      delay:
        description: 'Uygulama yüklenirken bekleme süresi (sn)'
        default: '6'
  push:
    branches: [main, master]

jobs:
  build-and-screenshot:
    runs-on: macos-14   # M1 Apple Silicon runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # macos-14 runner'ında Xcode 15.x default olarak gelir.
        # Belirli bir sürüm seçmek istersen burayı değiştir.
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      - name: List available simulators
        run: |
          echo "=== AVAILABLE SIMULATORS ==="
          xcrun simctl list devices available | head -40

      - name: Resolve selected device UDID
        id: sim
        run: |
          DEVICE="${{ github.event.inputs.device || 'iPhone 15 Pro' }}"
          echo "Selected device: $DEVICE"
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          target = '$DEVICE'
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['name'] == target and d.get('isAvailable', False):
                      print(d['udid'])
                      sys.exit(0)
          ")
          if [ -z "$UDID" ]; then
            echo "HATA: '$DEVICE' bulunamadı. Mevcut cihazlar:"
            xcrun simctl list devices available | grep -E "iPhone|iPad" | head -10
            exit 1
          fi
          echo "UDID=$UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          echo "device=$DEVICE" >> $GITHUB_OUTPUT

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ProjectKIR.xcodeproj \
            -scheme ProjectKIR \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            build 2>&1 | tee build.log

      - name: Locate .app bundle
        id: find_app
        run: |
          APP=$(find build/DerivedData -name "ProjectKIR.app" -path "*Debug*" | head -1)
          if [ -z "$APP" ]; then
            echo "HATA: ProjectKIR.app bulunamadı. Build log:"
            tail -50 build.log
            exit 1
          fi
          echo "Found app: $APP"
          echo "app_path=$APP" >> $GITHUB_OUTPUT

      - name: Boot simulator
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "Booting simulator $UDID..."
          xcrun simctl bootstatus "$UDID" -b || xcrun simctl boot "$UDID"
          # bootstatus, simülatör tamamen açılana dek bekler
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl install "$UDID" "${{ steps.find_app.outputs.app_path }}"

      - name: Launch app
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch "$UDID" com.placeholder.projectkir

      - name: Wait for app to render
        run: |
          DELAY="${{ github.event.inputs.delay || '6' }}"
          echo "Waiting $DELAY seconds for the app to render..."
          sleep "$DELAY"

      - name: Take screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p artifacts
          xcrun simctl io "$UDID" screenshot artifacts/screenshot.png
          echo "Screenshot saved."

      - name: Record 5-second video
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          # simctl recordVideo arka planda çalışır, öldürülecek
          xcrun simctl io "$UDID" recordVideo --codec=h264 artifacts/recording.mp4 &
          REC_PID=$!
          sleep 5
          kill -INT $REC_PID 2>/dev/null || true
          wait $REC_PID 2>/dev/null || true
          echo "Video saved."

      - name: Take a second screenshot after video
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl io "$UDID" screenshot artifacts/screenshot-after-5s.png

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-capture
          path: |
            artifacts/
            build.log
          if-no-files-found: warn
          retention-days: 30
